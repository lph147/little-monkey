<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小猴子 Little Monkey</title>
<!-- The app: added to a phone's home screen, the game opens full screen (manifest.webmanifest, and sw.js
     so it can be installed and played offline). The icons are made by tools/make-icons.js. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E392D">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小猴子">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- (crossorigin, so the app's offline copy can keep the fonts too) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" crossorigin>
<!-- Just the curly quotes ‘ ’ “ ” for English text (see --en in css/game.css). -->
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;700&text=%E2%80%98%E2%80%99%E2%80%9C%E2%80%9D&display=swap" rel="stylesheet" crossorigin>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div class="app">
  <div class="console">
    <div class="display">
    <div class="screen" id="screenWrap">
      <canvas id="screen" aria-label="Game screen"></canvas>
      <div class="titlecard" id="titlecard">
        <div class="titlehead"><h2>小猴子</h2><p id="areaName">Flower Fruit Mountain</p><div class="titletext" id="titleText" aria-live="polite"></div></div>
        <div class="slots" id="titleButtons"></div>   <!-- your three games (toTitle() in js/main.js) -->
        <p class="version" id="version"></p>   <!-- the version (js/version.js), to tell if this is the newest -->
      </div>
      <div class="capbox" id="capbox" hidden aria-live="polite"></div>
      <button class="btn skipcorner" id="skipBtn" hidden>Skip</button>
      <div class="placename" id="placeName" hidden role="status"></div>
      <div class="saybox" id="saybox" hidden role="status"></div>
      <div class="hud" id="hud" hidden aria-label="Your hearts"></div>
      <div class="talk" id="talk" hidden aria-live="polite"></div>
    </div>
    <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    </div>
    <div class="controls">
      <div class="power" aria-hidden="true"><i></i>POWER</div>   <!-- just for looks -->
      <div class="dpad" aria-label="Direction pad">
        <button class="u" data-dir="up" aria-label="Walk up">▲</button>
        <button class="l" data-dir="left" aria-label="Walk left">◀</button>
        <span class="c"></span>
        <button class="r" data-dir="right" aria-label="Walk right">▶</button>
        <button class="d" data-dir="down" aria-label="Walk down">▼</button>
      </div>
      <div class="ss">   <!-- Tasks and Menu: a Game Boy's Select and Start buttons -->
        <div class="sswrap"><button class="pill" id="selectBtn" aria-label="Your tasks"><span class="dot" id="selectDot" hidden></span></button><span class="sslabel">TASKS</span></div>
        <div class="sswrap"><button class="pill" id="startBtn" aria-label="The menu"></button><span class="sslabel">MENU</span></div>
      </div>
      <div class="ab">
        <div class="abwrap"><button class="round" id="btnB" aria-label="Back or menu">B</button><span class="ablabel" id="bLabel"></span></div>
        <div class="abwrap"><button class="round" id="btnA" aria-label="Talk or look">A</button><span class="ablabel" id="aLabel"></span></div>
      </div>
      <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>   <!-- the speaker, just for looks -->
    </div>
    <p class="keys">Arrow keys or WASD to move · Space or Enter for A · X for B (back) · M or Esc for the menu · T for your tasks</p>
  </div>
</div>
<div class="turn" id="turn" hidden role="status">   <!-- held upright: the game is played sideways (fit() in js/main.js) -->
  <svg viewBox="0 0 120 120" aria-hidden="true"><g class="phone"><rect x="40" y="18" width="40" height="84" rx="7" fill="none" stroke="currentColor" stroke-width="5"/><rect x="47" y="29" width="26" height="58" rx="2" fill="currentColor" opacity=".25"/><circle cx="60" cy="94" r="3" fill="currentColor"/></g></svg>
  <h2>小猴子</h2>
  <p>Turn your phone sideways to play</p>
  <p class="small">On a computer, make the window wider.</p>
</div>

<!-- The game's scripts. They load in this order, and each one can use what the ones above it define.
     First the content (words and areas), then the engine that runs it. -->
<script src="content/words.js"></script>
<script src="content/sprites.js"></script>
<script src="content/pictures.js"></script>
<script src="content/voices.js"></script>
<script src="content/flower-fruit-mountain.js"></script>
<script src="js/version.js"></script>
<script src="js/data.js"></script>
<script src="js/tips.js"></script>
<script src="js/state.js"></script>
<script src="js/helpers.js"></script>
<script src="js/sound.js"></script>
<script src="js/cards.js"></script>
<script src="js/quiz.js"></script>
<script src="js/scrolls.js"></script>
<script src="js/menu.js"></script>
<script src="js/world.js"></script>
<script src="js/battle.js"></script>
<script src="js/input.js"></script>
<script src="js/gamepad.js"></script>
<script src="js/art.js"></script>
<script src="js/draw.js"></script>
<script src="js/fullscreen.js"></script>
<script src="js/main.js"></script>
</body>
</html>
