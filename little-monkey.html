<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小猴子 Little Monkey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DCE9E0; --paper:#F7FBF7; --ink:#1E2B26; --muted:#56655E;
  --jade:#2E7A57; --jade-ink:#FFFFFF; --gold:#D9A21E; --line:#C3D6C9;
  --ok:#2E8B57; --bad:#C2453D; --scrim:rgba(20,35,28,.45);
  --shell:#B7D1C1; --shell-edge:#97B7A3; --bezel:#2F3D38; --pad:#33433D; --pad-ink:#E6F0EA;
  --btnA:#B8323A; --btnB:#3D6A93;
  --pixel:"Pixelify Sans", "Noto Sans SC", system-ui, sans-serif;
  --text:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D17; --paper:#1A3027; --ink:#E6F0EA; --muted:#A5B8AE;
    --jade:#5DBB8C; --jade-ink:#0E1C16; --gold:#F0C452; --line:#33503F;
    --ok:#5DBB8C; --bad:#EE7B72; --scrim:rgba(0,0,0,.6);
    --shell:#1E392D; --shell-edge:#2B4D3E; --bezel:#0A120F; --pad:#4A5D54; --pad-ink:#F2F7F4;
    --btnA:#C9454C; --btnB:#4F82B0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D17; --paper:#1A3027; --ink:#E6F0EA; --muted:#A5B8AE;
  --jade:#5DBB8C; --jade-ink:#0E1C16; --gold:#F0C452; --line:#33503F;
  --ok:#5DBB8C; --bad:#EE7B72; --scrim:rgba(0,0,0,.6);
  --shell:#1E392D; --shell-edge:#2B4D3E; --bezel:#0A120F; --pad:#4A5D54; --pad-ink:#F2F7F4;
  --btnA:#C9454C; --btnB:#4F82B0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:8px 10px 14px}
header{display:flex;align-items:center;gap:10px;padding:2px 4px 8px}
h1{font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.05em}
.stat{font-family:var(--pixel);font-size:1rem;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.menubtn{font-family:var(--pixel);font-size:1rem;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 12px;min-height:38px;box-shadow:0 3px 0 var(--ink)}
.menubtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.iconbtn{background:none;border:2px solid var(--line);border-radius:6px;padding:2px 8px;font-size:1rem;min-height:34px}

.console{background:var(--shell);border:2px solid var(--shell-edge);border-radius:16px 16px 40px 16px;padding:12px 12px 16px}
.screen{position:relative;margin:0 auto;background:var(--bezel);padding:8px;border-radius:8px 8px 18px 8px;width:max-content;max-width:100%}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:2px;touch-action:none}
.titlecard{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3% 12px 9%;text-align:center;color:#FFF6E0;pointer-events:none}
.titlecard[hidden]{display:none}
.titlecard h2{margin:0;font-size:clamp(2.2rem,11vw,3.4rem);letter-spacing:.12em;line-height:1.1;text-shadow:0 3px 0 #0E1A33}
.titlecard p{margin:2px 0 14px;font-family:var(--pixel);font-size:1rem;text-shadow:0 2px 0 #0E1A33}
.titlecard .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}

.textbox{margin-top:12px;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--line);padding:10px 12px;min-height:96px}
#goal{margin:0;font-size:.98rem}
.cap .cpy{color:var(--muted);font-size:.9rem}
.cap .czh{font-size:1.45rem;font-weight:500;line-height:1.3}
.cap .cen{font-size:.92rem}
.caprow{display:flex;align-items:center;gap:8px;margin-top:8px}
.caprow .spacer{flex:1}

.controls{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 6px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);touch-action:none}
.dpad button{background:var(--pad);color:var(--pad-ink);border:none;font-size:1.1rem;touch-action:none;display:flex;align-items:center;justify-content:center}
.dpad .u{grid-column:2;grid-row:1;border-radius:8px 8px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:8px 0 0 8px}
.dpad .c{grid-column:2;grid-row:2;background:var(--pad);pointer-events:none}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 8px 8px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 8px 8px}
.dpad button.held{filter:brightness(1.35)}
.ab{display:flex;gap:14px;align-items:flex-end;transform:rotate(-12deg)}
.abwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.round{width:62px;height:62px;border-radius:50%;border:none;color:#FFF;font-family:var(--pixel);font-size:1.4rem;box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:none}
.round:active,.round.held{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
#btnA{background:var(--btnA)}
#btnB{background:var(--btnB);width:52px;height:52px;font-size:1.1rem;margin-bottom:18px}
.ablabel{font-family:var(--pixel);font-size:.85rem;color:var(--muted);min-height:1.2em;transform:rotate(12deg)}
.keys{display:none;margin:10px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
@media (hover:hover) and (pointer:fine){.keys{display:block}}

.btn{font-family:var(--pixel);font-size:1rem;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:4px;box-shadow:0 3px 0 var(--ink);min-height:40px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--jade);color:var(--jade-ink)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.titlecard .btn{border-color:#0E1A33;box-shadow:0 3px 0 #0E1A33;background:#FFF6E0;color:#1E2B26}
.titlecard .btn.primary{background:#F2C14E}

.modal{position:absolute;inset:-6px;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:6px;border-radius:12px}
.modal[hidden]{display:none}
.sheet{width:100%;max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--line);padding:14px 14px 12px;animation:rise .16s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.who{font-size:2.4rem;line-height:1;margin-bottom:4px}
.speaker{display:flex;align-items:center;gap:12px;font-size:1rem;line-height:1.3}
.spk-zh{font-family:var(--text);font-size:1.2rem;font-weight:700}
.spk-py{font-weight:400;font-size:.9rem;color:var(--muted)}
.spk-en{font-family:var(--pixel);color:var(--jade);font-size:.95rem}
.engbtn{font-family:var(--pixel);font-size:.8rem;border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.label{font-family:var(--pixel);font-size:.95rem;color:var(--jade);margin:0 0 4px}
.line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 2px;margin:4px 0 6px}
.tok{display:inline-flex;flex-direction:column;align-items:center;background:none;border:none;border-bottom:2px dotted var(--line);padding:2px 3px 1px;font-size:1.55rem;line-height:1.2;font-family:var(--text);color:var(--ink);border-radius:3px}
.tok:hover{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.tok.on{background:color-mix(in srgb,var(--gold) 28%,transparent)}
.tok.learn{color:var(--jade);border-bottom:2px solid color-mix(in srgb,var(--jade) 55%,transparent);font-weight:500}
.tok.teach{font-weight:800;background:color-mix(in srgb,var(--jade) 12%,transparent)}
.tok.listen{color:var(--muted)}
.sentence-en{font-size:1rem;color:var(--ink);background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:4px;padding:4px 8px;margin:6px 0 8px}
ruby{ruby-position:over}
rt{font-size:.5em;color:var(--muted);font-family:var(--text)}
rt.hid{visibility:hidden}
.punct{font-size:1.55rem;line-height:1.2;padding-bottom:4px;align-self:flex-start;margin-top:.55em}
.gloss{min-height:1.6em;color:var(--muted);font-size:.95rem;margin:2px 0 8px}
.gloss b{color:var(--ink);font-weight:700}
.en{font-size:1rem;color:var(--ink);background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:4px;padding:4px 8px;margin:6px 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.actions .grow{margin-right:auto}
.word{text-align:center;padding:4px 0}
.pic{font-size:2.8rem;line-height:1.1}
.big{font-size:3.4rem;font-weight:500;line-height:1.15}
.py{font-size:1.25rem;color:var(--muted)}
.note{color:var(--muted);font-size:.95rem;margin:8px 0 0;text-align:center}
.pips{display:inline-flex;gap:4px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:2px;background:var(--line);display:block}
.pips i.on{background:var(--gold)}
.arena{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,color-mix(in srgb,var(--jade) 10%,var(--paper)),color-mix(in srgb,var(--jade) 22%,var(--paper)));border-radius:6px;padding:10px 12px;margin-bottom:8px}
.arena .foe{font-size:3.2rem;line-height:1;filter:drop-shadow(0 6px 0 color-mix(in srgb,var(--jade) 35%,transparent))}
.arena .name{font-family:var(--pixel);font-size:1rem}
.hearts{font-size:1.15rem;letter-spacing:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
.opt{font-size:2.5rem;line-height:1;padding:10px 0;background:var(--bg);border:2px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink)}
.opt.hz{font-size:2.1rem;font-family:var(--text);font-weight:500}
.opt .ico{display:block;font-size:2.1rem;line-height:1.1;white-space:nowrap}
.opt .cap{display:block;font-family:var(--text);font-size:1.05rem;margin-top:4px;color:var(--ink)}
.opt.right{background:color-mix(in srgb,var(--ok) 30%,var(--paper));border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 25%,var(--paper));border-color:var(--bad)}
.opt[disabled]{cursor:default}
.prompt{font-size:1rem;margin:6px 0 0}
.sayBig{font-size:2.2rem;border:2px solid var(--ink);background:var(--bg);border-radius:50%;width:80px;height:80px;box-shadow:0 3px 0 var(--ink)}
.center{text-align:center}
.feedback{text-align:center;font-size:1.05rem;min-height:1.6em;margin-top:6px}
.feedback .hz{font-size:1.5rem;font-weight:500;margin:0 6px}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:72px;padding:8px;border:2px dashed var(--line);border-radius:6px;margin:10px 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tile{font-family:var(--text);font-size:1.5rem;padding:4px 10px 6px;border:2px solid var(--ink);background:var(--bg);border-radius:5px;box-shadow:0 3px 0 var(--ink);line-height:1.2}
.tile rt{font-size:.5em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.card{border:2px solid var(--line);border-radius:6px;padding:8px 4px;text-align:center;background:var(--bg)}
.card .c{font-size:1.7rem;font-weight:500;line-height:1.2}
.card .p{font-size:.85rem;color:var(--muted);min-height:1.3em}
.card.unseen{opacity:.5}
.sent{margin:4px 0;border-radius:4px;padding:0 4px}
.sent .tok{font-size:1.45rem}
.sent .punct{font-size:1.45rem}
.sent.reading{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:4px;padding:2px 8px;font-size:1.2rem;background:var(--bg)}
.small{font-size:.85rem;color:var(--muted)}
.linkish{background:none;border:none;color:var(--bad);text-decoration:underline;font-size:.9rem;padding:4px}
.display{position:relative}
.tbhead{font-family:var(--pixel);font-size:.85rem;color:var(--jade);margin:0 0 2px}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;gap:8px;align-items:baseline;font-size:.98rem;line-height:1.4;padding:1px 0}
.tasks li::before{content:"";flex:none;width:9px;height:9px;border:2px solid var(--jade);border-radius:2px}
.tasks li.new{font-weight:600}
.tasks li.new::after{content:"New";flex:none;font-family:var(--pixel);font-size:.75rem;font-weight:400;color:var(--jade-ink);background:var(--jade);border-radius:3px;padding:0 5px;margin-left:auto}
.hint{margin:0;color:var(--muted)}
.saybox{position:absolute;left:14px;right:14px;bottom:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--line);padding:8px 12px;font-size:.95rem;line-height:1.4;animation:rise .16s ease-out;pointer-events:auto}
.saybox[hidden]{display:none}
.round.ready{box-shadow:0 4px 0 rgba(0,0,0,.3),0 0 0 4px var(--gold)}
.sheet button,.titlecard .btn,.caprow .btn{position:relative}
.sheet .menu button.navsel{outline:3px solid var(--gold);outline-offset:2px}
.sheet .actions .btn.primary:not([disabled])::before,.sheet .menu button.navsel::before,.titlecard .btn.primary::before,#beginBtn::before,#nextBtn::before{content:"A";position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;background:var(--btnA);color:#FFF;font:600 12px/20px var(--pixel);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.35);z-index:1}
.sheet [data-b]::after,#skipBtn::after{content:"B";position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--btnB);color:#FFF;font:600 12px/20px var(--pixel);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.35);z-index:1}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.howto{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.howto li{display:flex;gap:10px;align-items:flex-start}
.kbd{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#FFF;font-family:var(--pixel);font-size:1rem}
.kbd.a{background:var(--btnA)} .kbd.b{background:var(--btnB)} .kbd.pad{background:var(--pad);border-radius:6px} .kbd.menu{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:6px}
.dot{flex:none;width:30px;text-align:center;font-weight:700}
.dot.learn::before{content:"字";color:var(--jade);border-bottom:2px solid var(--jade)}
.dot.teach::before{content:"字";color:var(--jade);font-weight:800;border-bottom:2px solid var(--jade);background:color-mix(in srgb,var(--jade) 12%,transparent)}
.dot.listen::before{content:"字";color:var(--muted);border-bottom:2px dotted var(--line)}
.example{background:var(--bg);border-radius:6px;padding:4px 8px;margin:8px 0}
.menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.menu .btn .val{color:var(--muted);font-size:.9rem}
.checklist{list-style:none;margin:6px 0 10px;padding:0}
.checklist li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.checklist li::before{content:"";flex:none;width:12px;height:12px;border:2px solid var(--jade);border-radius:2px;transform:translateY(2px)}
.checklist li.done{color:var(--muted);text-decoration:line-through}
.checklist li.done::before{background:var(--jade)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.match .col{display:flex;flex-direction:column;gap:8px}
.mw,.mp{min-height:58px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);box-shadow:0 3px 0 var(--ink)}
.mw{font-family:var(--text);font-size:1.6rem}
.mw rt{font-size:.5em;color:var(--muted)}
.mp{font-size:1.8rem;white-space:nowrap}
.mw.sel{background:color-mix(in srgb,var(--gold) 35%,var(--paper));border-color:var(--gold)}
.mw.done,.mp.done{opacity:.25;box-shadow:none;cursor:default}
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.friends button{display:flex;flex-direction:column;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:6px;padding:8px 4px;font-family:var(--text)}
.friends .portrait{width:48px;height:48px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--pixel);color:var(--muted);margin:4px 0}
.portrait{width:56px;height:56px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.arena .portrait{width:72px;height:72px}
.toggles{display:flex;gap:6px}
.iconbtn[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>小猴子</h1>
    <span class="stat" id="peaches" title="Peaches">🍑 0</span>
    <span class="stat" id="count">0/26</span>
    <span class="spacer"></span>
    <button class="menubtn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
  </header>
  <div class="console">
    <div class="display">
    <div class="screen" id="screenWrap">
      <canvas id="screen" aria-label="Game screen"></canvas>
      <div class="titlecard" id="titlecard">
        <div><h2>小猴子</h2><p>Flower Fruit Mountain</p></div>
        <div class="row" id="titleButtons"></div>
      </div>
      <div class="saybox" id="saybox" hidden role="status"></div>
    </div>
    <div class="textbox" id="textbox" aria-live="polite"></div>
    <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    </div>
    <div class="controls">
      <div class="dpad" aria-label="Direction pad">
        <button class="u" data-dir="up" aria-label="Walk up">▲</button>
        <button class="l" data-dir="left" aria-label="Walk left">◀</button>
        <span class="c"></span>
        <button class="r" data-dir="right" aria-label="Walk right">▶</button>
        <button class="d" data-dir="down" aria-label="Walk down">▼</button>
      </div>
      <div class="ab">
        <div class="abwrap"><button class="round" id="btnB" aria-label="Back or menu">B</button><span class="ablabel" id="bLabel"></span></div>
        <div class="abwrap"><button class="round" id="btnA" aria-label="Talk or look">A</button><span class="ablabel" id="aLabel"></span></div>
      </div>
    </div>
    <p class="keys">Arrow keys or WASD to move · Space or Enter for A · X for B (back) · M or Esc for the menu</p>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const T = 16, VW = 11, VH = 10, STEP = 270, TURN_DELAY = 130;

/* ================= DATA ================= */
const WORDS = {
  '石头':{py:'shítou',en:'stone, rock',pic:'🪨'},
  '路':{py:'lù',en:'path, road',pic:'🛣️'},
  '你好':{py:'nǐ hǎo',en:'hello',pic:'👋'},
  '猴子':{py:'hóuzi',en:'monkey',pic:'🐒'},
  '山':{py:'shān',en:'mountain',pic:'⛰️'},
  '花':{py:'huā',en:'flower',pic:'🌸'},
  '草':{py:'cǎo',en:'grass',pic:'🌿'},
  '树':{py:'shù',en:'tree',pic:'🌳'},

function duck(){ if (AC && mBus && mTimer){ mBus.gain.cancelScheduledValues(AC.currentTime); mBus.gain.setTargetAtTime(musicLevel(), AC.currentTime, .25); } }

let zhVoice = null, speaking = false, speakSafety = 0, uttRef = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices(); zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null; } catch(e) {} }
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const speechBusy = () => speaking && performance.now() < speakSafety;
function say(text, onend){
  try {
    if (!('speechSynthesis' in window)) { onend && onend(); return; }
    const ss = speechSynthesis;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = 0.8;
    const done = () => { if (uttRef !== u) return; speaking = false; duck(); if (onend) onend(); };
    u.onend = done; u.onerror = done;
    uttRef = u; window.__lastUtterance = u;   // keep a reference so the browser does not cut it off
    speaking = true; speakSafety = performance.now() + text.length * 500 + 2000; duck();
    if (ss.speaking || ss.pending){ ss.cancel(); setTimeout(() => { if (uttRef === u) ss.speak(u); }, 90); }
    else ss.speak(u);
  } catch(e) { speaking = false; onend && onend(); }
}
function stopSpeech(){ try { uttRef = null; speaking = false; speechSynthesis.cancel(); duck(); } catch(e) {} }
function unlockSpeech(){ try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e) {} }

function pictureQ({head, body, options, answerIdx, word, type, text, onShow}){

const picWords = () => ORDER.filter(w => WORDS[w].pic);
const canEncounter = () => picWords().filter(w => lvl(w) >= 1).length >= 3;
const canWild = () => lvl('动物') >= 1 && canEncounter();
async function encounter(foe){
  const an = foe.hz, img = foe.img;
  let showEn = false;
  const nameHTML = () => foe.name
    ? `<div class="spk-zh">${foe.name.zh} <span class="spk-py">${foe.name.py}</span></div><div class="spk-en">${foe.name.en}</div>`
    : `<div class="spk-zh">${an} <span class="spk-py">${WORDS[an].py}</span>${foe.justTaught ? '' : (showEn ? ` <span class="small">${esc(WORDS[an].en)}</span>` : ' <button class="engbtn" data-a="foeen">English</button>')}</div>`;
  const pool = picWords().filter(w => lvl(w) >= 1).sort((a,b) => (rec(a).due - rec(b).due) || (lvl(a) - lvl(b)));
  const targets = shuffle(pool.slice(0, 5)).slice(0, 3);
  let score = 0;
  for (let i = 0; i < targets.length; i++){
    const w = targets[i], L0 = lvl(w);
    const type = L0 <= 1 ? 'listen' : L0 === 2 ? 'read' : (Math.random() < .6 ? 'hear' : 'read');
    const others = shuffle(picWords().filter(x => x !== w && lvl(x) >= 1));   // only words you have already met
    const opts = shuffle([w].concat(others.slice(0, 2)));
    const hearts = `<div class="hearts" aria-label="${score} of 3 friendship">${[0,1,2].map(k => `<span style="${k < score ? '' : 'opacity:.22;filter:grayscale(1)'}">🍑</span>`).join('')}</div>`;
    const head = `<div class="arena"><div><div class="name">${nameHTML()}</div>${hearts}</div>${img}</div>`;
    let body;
    if (type === 'listen') body = `<p class="prompt">Listen. Which picture is it?</p><div class="center"><button class="sayBig" data-a="say" aria-label="Play the word again">🔊</button></div>`;
    else if (type === 'read') body = `<p class="prompt">Read it. Which picture is it?</p><div class="word"><div class="big">${w}</div></div>`;
    else body = `<p class="prompt">Listen. Which characters is it?</p><div class="center"><button class="sayBig" data-a="say" aria-label="Play the word again">🔊</button></div>`;
    const ok = await pictureQ({head, body, word: w, type,
      options: opts.map(o => type === 'hear' ? o : `<span class="ico">${WORDS[o].pic}</span><span class="cap">${type === 'read' ? WORDS[o].py : o}</span>`), text: type === 'hear',
      answerIdx: opts.indexOf(w), onShow: () => {
        if (type !== 'read') setTimeout(() => say(w), 300);
        on('[data-a=foeen]', e => { showEn = true; e.currentTarget.outerHTML = ` <span class="small">${esc(WORDS[an].en)}</span>`; });
      }});
    if (ok) score++;
  }
  close();
  S.peaches += score; S.encounters = (S.encounters || 0) + 1;
  const won = score >= 2;
  let msg;
  if (won){
    if (!S.friends.includes(foe.id)) S.friends.push(foe.id);
    SFX.fanfare();
    msg = `You got ${score} of 3. The ${wz(an)} is now your ${wz('朋友')}! +${score} 🍑`;
  } else msg = `You got ${score} of 3. The ${wz(an)} ${foe.wild ? `ran back into the ${wz('草')}` : 'wants to play again later'}. Those words will come back soon.`;
  save();
  await infoBox(img, `<p>${msg}</p>`);
  return won;
}

function tiles(who, target, extras, prompt){

    let picked = [];
    const tileBtn = (o, where) => { const [py] = info(o.t); const show = S.pinyin;
      return `<button class="tile" data-w="${where}" data-i="${o.i}"><ruby>${o.t}<rt class="${show ? '' : 'hid'}">${py}</rt></ruby></button>`; };
    function render(msg){
      open(`<div class="who" aria-hidden="true">${who}</div><p class="prompt">${prompt}</p>
        <div class="slots" aria-label="Your sentence">${picked.map(o => tileBtn(o,'s')).join('') || '<span class="small">Tap the words below in order.</span>'}</div>
        <div class="bank">${bank.filter(o => !picked.includes(o)).map(o => tileBtn(o,'b')).join('')}</div>
        <div class="feedback" aria-live="polite">${msg || ''}</div>
        <div class="actions"><button class="btn grow" data-a="say">🔊 Hear the monkey</button><button class="btn primary" data-a="check" ${picked.length === target.length ? '' : 'disabled'}>Say it</button></div>`);
      sheet.querySelectorAll('.tile').forEach(b => b.onclick = () => {
        const o = bank.find(x => x.i === +b.dataset.i);
        say(o.t); SFX.blip();
        if (b.dataset.w === 'b') picked.push(o); else picked = picked.filter(x => x !== o);
        render();
      });
      on('[data-a=say]', () => say(target.join('')));
      on('[data-a=check]', () => {
        if (picked.map(o => o.t).join('') === target.join('')){ SFX.right(); say(target.join('')); close(); res(true); }
        else { picked = []; SFX.wrong(); render('Not quite. Listen again and try once more.'); sheet.querySelector('.slots').classList.add('shake'); say(target.join('')); }
      });
    }
    render();
  });
}

const PASS = 0.8;
function wordTest(){
  return new Promise(res => {
    const words = shuffle(ORDER.filter(w => WORDS[w].pic && lvl(w) >= 1));
    const rounds = []; for (let i = 0; i < words.length; i += 4) rounds.push(words.slice(i, i + 4));
    if (rounds.length > 1 && rounds[rounds.length - 1].length < 3){ const last = rounds.pop(); rounds[rounds.length - 1].push(...last); }
    const missed = new Set();
    let r = 0, picked = null;
    function render(){
      const set = rounds[r], left = shuffle(set), right = shuffle(set);
      open(`<p class="label">Word test · ${r + 1} of ${rounds.length}</p>
        <p class="small">Tap a word, then tap its picture.</p>
        <div class="match"><div class="col">${left.map(w => `<button class="mw" data-w="${w}"><ruby>${w}<rt class="${S.pinyin ? '' : 'hid'}">${WORDS[w].py}</rt></ruby></button>`).join('')}</div>
        <div class="col">${right.map(w => `<button class="mp" data-w="${w}">${WORDS[w].pic}</button>`).join('')}</div></div>
        <div class="feedback" aria-live="polite"></div>
        <div class="actions"><button class="btn" data-a="quit" data-b>Stop test</button></div>`);
      picked = null;
      const fb = sheet.querySelector('.feedback');
      sheet.querySelectorAll('.mw').forEach(bt => bt.onclick = () => {
        if (bt.classList.contains('done')) return;
        sheet.querySelectorAll('.mw.sel').forEach(x => x.classList.remove('sel'));
        bt.classList.add('sel'); picked = bt.dataset.w; say(picked); fb.textContent = '';
      });
      sheet.querySelectorAll('.mp').forEach(bt => bt.onclick = () => {
        if (bt.classList.contains('done')) return;
        if (!picked){ fb.textContent = 'Tap a word first.'; return; }
        const wbtn = sheet.querySelector(`.mw[data-w="${picked}"]`);
        if (bt.dataset.w === picked){
          SFX.right(); bt.classList.add('done'); wbtn.classList.remove('sel'); wbtn.classList.add('done'); picked = null;
          if (![...sheet.querySelectorAll('.mw')].some(x => !x.classList.contains('done'))){
            setTimeout(() => { r++; if (r < rounds.length) render(); else finish(); }, 450);
          }
        } else {
          SFX.wrong(); missed.add(picked); bt.classList.add('shake'); setTimeout(() => bt.classList.remove('shake'), 400);
          fb.textContent = 'Not that one. Try again.';
        }
      });
      on('[data-a=quit]', () => { close(); res(false); });
    }
    function finish(){
      const right = words.length - missed.size, need = Math.ceil(words.length * PASS), pass = right >= need;
      missed.forEach(w => { const rr = rec(w); rr.due = Date.now(); });
      save();
      if (pass) SFX.fanfare(); else SFX.wrong();
      open(`<div class="who" aria-hidden="true">${pass ? '🎉' : '📜'}</div>
        <p class="label">${pass ? 'Test passed!' : 'Not quite yet'}</p>
        <p>You matched <b>${right} of ${words.length}</b> words right first time. You needed ${need}.</p>
        ${missed.size ? `<p class="small">Words to practise:</p><div class="chips">${[...missed].map(w => `<button class="chip" data-w="${w}">${w}</button>`).join('')}</div><div class="gloss">Tap a word to hear it.</div>` : ''}
        ${pass ? '' : '<p>Walk around the mountain, look at things again and meet animals in the tall grass. Then come back to the door and try again.</p>'}
        <div class="actions"><button class="btn primary" data-a="ok">${pass ? 'Go through the door' : 'Back to the mountain'}</button></div>`);
      sheet.querySelectorAll('.chip').forEach(bt => bt.onclick = () => { const w = bt.dataset.w; say(w); sheet.querySelector('.gloss').innerHTML = `<b>${w}</b> ${WORDS[w].py} · ${esc(WORDS[w].en)}`; });
      on('[data-a=ok]', () => { close(); res(pass); });
    }
    render();
  });
}

  pl.x = 3; pl.y = 4; pl.dir = 'down'; pl.px = pl.x*T; pl.py = pl.y*T; S.pos = {x:3, y:4, dir:'down'}; save();
}

/* ================= WORLD LOGIC ================= */
function tileAt(x, y){ if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 'M'; let c = MAP[y][x]; if (c === 'R' && S.gate) c = '.'; return c; }
const npcAt = (x, y) => NPCS.find(n => n.x === x && n.y === y);
const walkable = (x, y) => 'gGF.B'.includes(tileAt(x, y)) && !npcAt(x, y);
const DV = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
const OPP = {up:'down', down:'up', left:'right', right:'left'};

const learnedCount = () => ORDER.filter(w => lvl(w) >= 1).length;
const ELDER_NEED = 4;
const elderReady = () => learnedCount() - 1 >= ELDER_NEED;
const metCount = () => Math.min(S.met.length, ANIMALS.length);
const areaDone = () => S.q.elder >= 2 && S.q.hungry === 3 && S.q.thirsty === 3 && metCount() >= ANIMALS.length && S.story;
function getTasks(){
  const q = S.q, t = [];
  if (q.elder === 0) t.push({id:'elder', text:'Talk to the old monkey on the path', target:[10,5], npc:true});
  if (q.elder === 1) t.push(elderReady()
    ? {id:'elder2', text:'Talk to the old monkey again', target:[10,5], npc:true}
    : {id:'learn4', text:`Learn ${ELDER_NEED} words, then talk to the old monkey again (${Math.min(learnedCount() - 1, ELDER_NEED)}/${ELDER_NEED})`, target:null});
  if (q.elder >= 2 && metCount() < ANIMALS.length) t.push({id:'animals', text:`Find the hidden animals in the tall grass (${metCount()}/${ANIMALS.length})`, target:null});
  if (q.hungry === 1 && !S.carry) t.push({id:'h1', text:'Find the fruit the hungry monkey asked for', target:[2,7]});
  if (q.hungry === 1 && S.carry) t.push({id:'h2' + S.carry, text:`Give the ${wz(S.carry)} to the hungry monkey`, target:[13,5], npc:true});
  if (q.thirsty === 1) t.push({id:'t1', text:'Collect water from the river or the pond', target:[11,9]});
  if (q.thirsty === 2) t.push({id:'t2', text:`Give the ${wz('水')} to the thirsty monkey`, target:[2,12], npc:true});
  if (S.gate && !S.story) t.push({id:'fall', text:'Climb up beside the river to the waterfall', target:[18,1]});
  if (areaDone() && !S.area1Done) t.push({id:'door', text:`Pass the word test at the ${wz('洞')} door`, target:[3,3]});
  return t;
}
function tasksHint(){
  const q = S.q;
  if (q.elder > 0 && (q.hungry === 0 || q.thirsty === 0)) return 'Monkeys with a ! above them need help. Walk up to one and press A.';
  if (S.area1Done) return `Flower Fruit Mountain is complete. Practise in the ${wz('草')} or visit your friends.`;
  return '';
}
function goalText(){ const t = getTasks(); return t.length ? t.map(x => x.text).join('. ') + '.' : tasksHint(); }
const newTaskUntil = {};
function facing(){ const [dx,dy] = DV[pl.dir]; return [pl.x + dx, pl.y + dy]; }
function promptFor(x, y){
  const n = npcAt(x, y);
  if (n) return n.kind === 'bird' ? 'Look' : 'Talk';
  const c = tileAt(x, y);
  if ((c === 'P' || c === 'Q') && S.q.hungry === 1) return 'Pick';
  if ('PQXNCSR'.includes(c)) return 'Look';
  if (c === 'W' || c === 'O') return S.q.thirsty === 1 ? 'Collect' : (lvl(c === 'W' ? '河' : '鱼') === 0 ? 'Look' : '');
  const w = {M:'山', T:'树', '.':'路', G:'草', F:'花'}[c];
  if (w && lvl(w) === 0) return 'Look';
  if (c === 'T' && x >= 20 && lvl('森林') === 0) return 'Look';
  return '';
}
function checkGate(){
  if (!S.gate && S.q.hungry === 3 && S.q.thirsty === 3){
    S.gate = true; save(); buildMap(); SFX.rumble(); shakeT = performance.now();
    toast(`A rumble from the ${wz('山')}! The rocks north of the meadow have rolled away.`);
  }
}
async function talk(n){
  const q = S.q;
  n.dir = OPP[pl.dir];
  if (n.kind === 'bird'){ await showNotice('鸟', {note:'A little bird hops about, singing.'}); return; }
  const face = speaker(n.kind);
  if (n.kind === 'elder'){
    if (q.elder === 0){
      await showDialog(face, L.hi, {teach:'你好'});
      if (lvl('你好') === 0) await showNotice('你好');
      await showDialog(face, L.go, {hint:`Things that sparkle have a word to learn. Face them and press A. Learn ${ELDER_NEED} words, then come back and talk to me again.`});
      q.elder = 1; save();
    } else if (q.elder === 1 && !elderReady()){
      await showDialog(face, L.go, {hint:`Learn ${ELDER_NEED} words first, then come back. (${Math.min(learnedCount() - 1, ELDER_NEED)}/${ELDER_NEED})`});
    } else if (q.elder === 1){
      await showDialog(face, L.animals, {teach:'动物', hint:'Walk through the tall grass to find the hidden animals. Answer their questions to make friends.'});
      if (lvl('动物') === 0) await showNotice('动物', {note:`There are ${ANIMALS.length} different animals hiding in the tall grass. Can you find them all?`});
      q.elder = 2; save();
    } else await showDialog(face, L.hi, {hint: goalText() || 'Keep exploring, little monkey.'});
    return;
  }
  if (q.elder === 0){
    await showDialog(face, L.findElder, {hint:'Talk to the old monkey on the path first. He’ll tell you what to do.'});
    return;
  }
  if (n.kind === 'playful'){
    if (lvl('猴子') === 0){ await showDialog(face, L.iam, {teach:'猴子'}); await showNotice('猴子'); return; }
    if (lvl('朋友') === 0){ await showDialog(face, L.weFriends, {teach:'朋友'}); await showNotice('朋友', {note:'Come back and play a word game with me any time.'}); return; }
    await showDialog(face, L.play);
    if (canEncounter()){ if (await confirmBox(face, 'Play a word game with this little monkey?', 'Play', 'Not now')){ SFX.encounter(); await encounter({id:'playful', hz:'猴子', img: portrait('playful'), wild:false, name: NAMES.playful}); } }
    else toast('Learn a few more words first, then come back to play.');
    return;
  }
  const isH = n.kind === 'hungry', key = n.kind;
  const ask = isH ? L.hungry : L.thirsty, verb = isH ? '吃' : '喝', thing = isH ? '桃子' : '水';
  const ready = isH ? (q.hungry === 1 && S.carry === '桃子') : q.thirsty === 2;
  if (isH && q.hungry === 1 && S.carry && S.carry !== '桃子'){
    await showDialog(face, L.notThis);
    S.carry = null; save(); toast('The monkey gives the fruit back. Listen to what it wants, then try another tree.');
    return;
  }
  if (q[key] <= 1 && !ready){
    await showDialog(face, ask, {teach: lvl(verb) === 0 ? verb : null});
    if (lvl(verb) === 0) await showNotice(verb);
    if (q[key] === 0){ q[key] = 1; save(); toast(isH ? 'The hungry monkey wants something to eat. Check your tasks.' : 'The thirsty monkey wants something to drink. Check your tasks.'); }
  } else if (ready){
    await showDialog(face, isH ? L.havePeach : L.haveWater, {ok:'Give it'});
    const nw = ['要','我'].find(w => lvl(w) === 0);
    if (nw) await showNotice(nw, {note: nw === '要' ? 'Use 要 to say what you want.' : '我 means I or me.'});
    await tiles(face, ['我','要',verb,thing], [isH ? '喝' : '吃'], 'Say what the monkey wants. Put the words in order.');
    ['我','要',verb,thing].filter(w => lvl(w) >= 1).forEach(w => setLevel(w, 4));
    q[key] = 3; if (isH) S.carry = null; S.peaches += 3; save(); SFX.fanfare();
    await showDialog(face, L.thanks);
    toast('+3 🍑. Task complete!');
    checkGate();
  } else await showDialog(face, L.thanks);
}
async function interact(x, y){
  const n = npcAt(x, y);
  if (n) return talk(n);
  const c = tileAt(x, y), q = S.q;
  switch (c){
    case 'S': await showNotice('石头', {note:'You were born from this stone.'}); break;
    case 'R': await showNotice('石头'); toast('Big rocks block the way up. Maybe they will move once the monkeys are happy.'); break;
    case 'M': await showNotice('山'); break;
    case '.': await showNotice('路'); break;
    case 'G': await showNotice('草'); break;
    case 'F': await showNotice('花'); break;
    case 'T':
      if (lvl('树') > 0 && (x >= 20 || x === 0 || y === ROWS - 1 || (x === HOT['森林'][0] && y === HOT['森林'][1]))) await showNotice('森林', {note:'So many trees together.'});
      else await showNotice('树');
      break;
    case 'P': case 'Q': {
      const fruit = c === 'P' ? '桃子' : '苹果';
      if (q.hungry === 1){
        if (lvl(fruit) === 0) await showNotice(fruit, {note:'You pick one from the tree.'});
        S.carry = fruit; save(); SFX.right(); toast(`You picked a ${wz(fruit)}. Take it to the hungry monkey.`);
      } else await showNotice(fruit);
      break; }
    case 'W': case 'O':
      if (q.thirsty === 1){
        // the quest comes first: collecting water is where 水 is introduced
        if (lvl('水') === 0) await showNotice('水', {note: c === 'W' ? 'You scoop up some water from the river.' : 'You scoop up some water from the pond.'});
        q.thirsty = 2; save(); SFX.right(); toast(`You collected some ${wz('水')}. Take it to the thirsty monkey.`);
      } else if (c === 'W') await showNotice('河');
      else await showNotice('鱼', {note: lvl('鱼') === 0 ? 'Little fish dart about in the pond.' : ''});
      break;
    case 'C':
      if (lvl('洞') === 0) await showNotice('洞', {note:'A cave in the cliff, closed by a heavy stone door.'});
      if (!areaDone()) await infoBox('🚪', '<p>The door won’t move. Finish everything on Flower Fruit Mountain first:</p>' + checklistHTML(true));
      else if (await confirmBox('🚪', `The door has rolled open. To go through, pass a short word test: match each word you learned here to its picture. You need ${Math.round(PASS*100)}% right first time.`, 'Start the test', 'Not yet')){ if (await wordTest()) await nextArea(); }
      break;
    case 'X':
      await showNotice('瀑布', {note:`Water crashes down the ${wz('山')}. What could be behind it?`});
      await storyScroll();
      break;
    case 'N':
      SFX.blip();
      await showDialog(speaker('sign'), {t:['花果山'], en:'Flower Fruit Mountain'}, {hint:'The name of your home. You will see it often in the book.'});
      break;
    default: SFX.bump();
  }
}
let stepsSince = 0;
async function arrive(x, y){
  S.pos = {x, y, dir:pl.dir}; save();
  const c = tileAt(x, y);
  if (c === '.' && lvl('路') === 0) return showNotice('路', {note:'You are walking along a path.'});
  if (c === 'F' && lvl('花') === 0) return showNotice('花');
  if (c === 'G'){
    stepsSince++;
    if (lvl('草') === 0) return showNotice('草', {note:'Tall grass. Animals hide in here.'});
    if (canWild() && stepsSince >= 3 && Math.random() < 0.22){ stepsSince = 0; held = null; queued = null; return wildAppears(); }
  }
}

let foe = null, alertUntil = 0;
function findSpot(){
  const order = [pl.dir].concat(['down','left','right','up'].filter(d => d !== pl.dir));
  for (const d of order){ const [dx,dy] = DV[d], x = pl.x + dx, y = pl.y + dy; if ('gGF.'.includes(tileAt(x,y)) && !npcAt(x,y)) return {x, y, d}; }
  const [dx,dy] = DV[pl.dir]; return {x:pl.x + dx, y:pl.y + dy, d:pl.dir};
}
async function wildAppears(){
  const unmet = ANIMALS.filter(x => !S.met.includes(x.id));
  const pool = unmet.length && Math.random() < .75 ? unmet : ANIMALS;
  const a = pool[Math.floor(Math.random() * pool.length)];
  const spot = findSpot();
  pl.dir = spot.d;
  foe = {a, x:spot.x, y:spot.y, t0:performance.now(), state:'in'};
  alertUntil = performance.now() + 1000;
  SFX.encounter();
  await sleep(1100);
  const firstMeet = !S.met.includes(a.id);
  if (firstMeet){ S.met.push(a.id); save(); }
  const justTaught = lvl(a.hz) === 0;
  if (justTaught) await showNotice(a.hz, {note:`A wild ${a.name} jumped out of the ${wz('草')}! Answer its questions to make friends.`});
  else { say(a.hz); await sleep(900); }
  if (firstMeet) toast(`Hidden animals found: ${Math.min(S.met.length, 4)}/4`);
  const won = await encounter({id:a.id, hz:a.hz, img:portrait(a.id), wild:true, justTaught});
  foe.state = won ? 'happy' : 'flee'; foe.t1 = performance.now();
  await sleep(won ? 1000 : 650);
  foe = null;
}

/* ================= PLAYER & INPUT ================= */
const pl = {x:START.x, y:START.y, px:START.x*T, py:START.y*T, dir:'down', mv:null, parity:0, turnT:0};
function placePlayer(){ pl.x = S.pos.x; pl.y = S.pos.y; pl.dir = S.pos.dir || 'down'; pl.px = pl.x*T; pl.py = pl.y*T; pl.mv = null; }
let held = null, queued = null, busy = false, mode = 'title', lastBump = 0, shakeT = -9999, lastMoveEnd = 0, fadeT = -9999;
const canAct = () => mode === 'play' && !busy && modal.hidden && !pl.mv;
function tryStep(d, now){
  if (d !== pl.dir){ pl.dir = d; pl.turnT = now; SFX.turn(); return; }   // first turn to face the new way
  if (now - pl.turnT < TURN_DELAY) return;                                 // short pause so the turn is visible
  const [dx,dy] = DV[d], nx = pl.x + dx, ny = pl.y + dy;
  if (walkable(nx, ny)){ pl.mv = {fx:pl.x, fy:pl.y, tx:nx, ty:ny, t0:now}; pl.parity ^= 1; }
  else if (now - lastBump > 300){ lastBump = now; SFX.bump(); }
}
function update(now){
  if (mode !== 'play') return;
  if (pl.mv){
    const m = pl.mv, p = Math.min(1, (now - m.t0) / STEP);
    pl.px = (m.fx + (m.tx - m.fx) * p) * T; pl.py = (m.fy + (m.ty - m.fy) * p) * T;
    if (p >= 1){
      pl.x = m.tx; pl.y = m.ty; pl.mv = null; busy = true; lastMoveEnd = now;
      Promise.resolve(arrive(pl.x, pl.y)).finally(() => { busy = false; updateHUD(); });
    }
    return;
  }
  if (!canAct()) return;
  const tapped = queued; queued = null;
  if (tapped && tapped !== pl.dir){ tryStep(tapped, now); return; }
  const d = held || tapped;
  if (d) tryStep(d, now);
}
async function pressA(){
  if (mode === 'title'){ const t = $('#titleButtons .primary'); if (t) t.click(); return; }
  if (mode === 'intro'){ const bb = $('#beginBtn') || $('#nextBtn'); if (bb) bb.click(); return; }
  if (!modal.hidden){
    const f = document.activeElement, inMenu = !!sheet.querySelector('.menu');
    if (inMenu && f && sheet.contains(f) && f.matches(NAV_SEL) && !f.disabled) f.click();
    else { const p = [...sheet.querySelectorAll('.primary')].find(x => !x.hidden && !x.disabled); if (p) p.click(); else if (inMenu){ const first = navItems()[0]; if (first) first.click(); } }
    return;
  }
  if (!canAct()) return;
  const [fx, fy] = facing();
  busy = true;
  try { await interact(fx, fy); } finally { busy = false; updateHUD(); }
}
function pressB(){
  if (!modal.hidden){ const b = sheet.querySelector('[data-b]'); if (b && !b.disabled && b.offsetParent !== null) b.click(); return; }
  if (mode === 'intro'){ const sk = $('#skipBtn'); if (sk) sk.click(); return; }
  const sb = $('#saybox'); if (!sb.hidden){ sb.hidden = true; return; }
}
function pressMenu(){
  if (!modal.hidden){ if (sheet.querySelector('[data-m]')) close(); return; }

    // The scene waits at each sentence until the player presses Next.
    const dt = Math.min(.05, (now - introLast) / 1000); introLast = now;
    let nt = introClock + dt;
    const next = CAPS[capIdx + 1];
    if (next && nt >= next.t && advancedTo < capIdx + 1) nt = Math.max(introClock, next.t - .001);
    introClock = nt;
    const t = introClock;
    drawScene(t, now);
    const ci = CAPS.reduce((a, c, i) => t >= c.t ? i : a, 0);
    if (ci !== capIdx){ capIdx = ci; capShownAt = now; showCaption(CAPS[ci], ci === CAPS.length - 1); }

      bindTokens(sheet);
      on('[data-a=back]', () => { i--; show(); });
      on('[data-a=next]', () => { if (i < pages.length - 1){ i++; show(); } else { S.howto = true; save(); close(); res(); } });
    };
    show();
  });
}
async function startGame(){
  stopSpeech();
  const firstTime = !S.started;
  $('#titlecard').hidden = true;
  if (firstTime){ S.started = true; S.pos = {x:START.x, y:START.y, dir:'up'}; }
  placePlayer(); mode = 'play'; lastTB = ''; save(); musicStart();
  if (firstTime){
    busy = true;
    try {
      await howToPlay();
      await showNotice('石头', {note:'You were just born from this stone!'});
      toast('Walk down the path and say hello to the old monkey.');
    } finally { busy = false; updateHUD(); }
  }
}

window.addEventListener('resize', fit);
buildMap(); placePlayer(); fit(); updateHUD(); toTitle();
requestAnimationFrame(frame);
})();
</script>
